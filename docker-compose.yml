services:
  payload:
    build:
      context: .
    image: waitforit-site:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CONTENT_REPO_ROOT: /content
      DATABASE_URL: file:./data/payload.db
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - payload_data:/app/data
      - payload_media:/app/media
      - ${CONTENT_REPO_HOST_PATH:-../waitforit-site-content}:/content:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  content-sync:
    profiles:
      - tools
    build:
      context: .
      target: content-sync
    image: waitforit-site-content-sync:local
    restart: 'no'
    env_file:
      - .env
    environment:
      CONTENT_REPO_ROOT: /content
      CONTENT_SYNC_STATE_FILE: /app/data/content-sync-last-successful-sha
      DATABASE_URL: file:./data/payload.db
      NODE_ENV: production
    volumes:
      - payload_data:/app/data
      - payload_media:/app/media
      - ${CONTENT_REPO_HOST_PATH:-../waitforit-site-content}:/content:ro

volumes:
  payload_data:
  payload_media:
