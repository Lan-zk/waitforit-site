services:
  payload:
    build:
      context: .
    image: waitforit-site:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: file:./data/payload.db
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - payload_data:/app/data
      - payload_media:/app/media
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  payload_data:
  payload_media:
